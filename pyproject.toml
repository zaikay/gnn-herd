[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "be-gnn"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas==2.2.3", "numpy==2.2.6", "geopandas==1.0.1",
  "shapely==2.1.1", "pyogrio==0.11.0", "pyproj==3.7.1",
  "networkx==3.4.2", "matplotlib==3.10.3", "PyYAML==6.0.2",
  "beautifulsoup4==4.13.4", "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
baselines = ["scikit-learn==1.6.1", "scipy==1.15.3", "joblib==1.5.1", "threadpoolctl==3.6.0", "dieboldmariano==1.1.0"]
gnn = ["torch==2.7.1", "filelock==3.18.0", "fsspec==2025.5.1", "Jinja2==3.1.6", "MarkupSafe==3.0.2", "mpmath==1.3.0", "sympy==1.14.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Use pytest's per-user temporary directory; a shared fixed path can be owned
# by a different Windows account after an agent run. Cache is optional.
addopts = "-p no:cacheprovider"
